<!DOCTYPE html>
<!-- AURA System v7.57 — Tarefas Otimizadas: Agrupamento + Avatares + Notificação -->
<!-- AURA build v7.34 — Chart.js carregado sem bloquear a leitura inicial -->
<html lang="pt-BR" class="dark">
<head>
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://docs.google.com" crossorigin>
<link rel="preconnect" href="https://unpkg.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA Vencimentos</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="AURA Venc.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#D4001A">
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1e1e1c;--bg2:#282825;--bg3:#323230;--surface:#2a2a2a;--surface-2:#333333;
  --tx:#f0efe8;--tx2:#9b9b95;--bd:rgba(255,255,255,.1);--bds:rgba(255,255,255,.2);
  --r:8px;--rl:12px;
  --green:#1D9E75;--gd:#0F6E56;--blue:#378ADD;--amber:#BA7517;--red:#E24B4A;
  --emerald:#10b981;--yellow:#eab308;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg3);color:var(--tx);min-height:100vh}
html,body{overflow-x:hidden;max-width:100%}
.app{max-width:100%;margin:0;padding:0;overflow-x:hidden}

/* ──────────────────────────────────────────────────────
   ESTILOS ORIGINAIS MANTIDOS
   ────────────────────────────────────────────────────── */
.cfg{background:var(--bg);border:2px dashed var(--bds);border-radius:var(--rl);padding:20px 24px;margin-bottom:20px;display:none}
.cfg h3{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px;color:var(--amber)}
.cfg-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cfg-field label{display:block;font-size:11px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.cfg-field input{width:100%;font-size:13px;padding:8px 11px;border:1px solid var(--bds);border-radius:var(--r);background:var(--bg2);color:var(--tx);outline:none}
.cfg-hint{font-size:12px;color:var(--tx2);margin-top:10px;line-height:1.7}
.cfg-hint code{background:var(--bg2);padding:1px 5px;border-radius:4px;font-size:11px}
.status-row{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:#888;flex-shrink:0}
.dot.ok{background:var(--green)}.dot.err{background:var(--red)}.dot.loading{background:var(--amber)}
.st{font-size:13px;color:var(--tx2)}.sync-time{font-size:12px;color:var(--tx2);margin-left:auto}
.topbar{display:none}
.btn{border:1px solid var(--bds);background:var(--bg);color:var(--tx);font-size:13px;font-weight:500;padding:7px 16px;border-radius:var(--r);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s;white-space:nowrap}
.btn:hover{background:var(--bg2)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-green{background:var(--green);border-color:var(--green);color:#fff}.btn-green:hover{background:var(--gd)}
.btn-sm{padding:5px 11px;font-size:12px}
@keyframes spin{to{transform:rotate(360deg)}}.spin{animation:spin 1s linear infinite;display:inline-block}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:10px;margin-bottom:20px}
.metric{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;transition:border-color .15s,transform .1s,box-shadow .15s;user-select:none}.metric:hover{transform:translateY(-1px)}
.metric.clickable{cursor:pointer}.metric.clickable:hover{border-color:var(--bds);box-shadow:0 4px 12px rgba(0,0,0,.1)}.metric.clickable.active-filter{border-color:var(--green);box-shadow:0 0 0 3px rgba(29,158,117,.18);transform:translateY(-1px)}
.metric-lbl{font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.metric-val{font-size:28px;font-weight:600}
.metric-val.danger{color:var(--red)}.metric-val.warn{color:var(--amber)}.metric-val.ok{color:var(--green)}.metric-val.info{color:var(--blue)}
.tabs{display:flex;gap:2px;margin-bottom:20px;border-bottom:1px solid var(--bd)}
.tab{font-size:13px;font-weight:500;padding:10px 18px;cursor:pointer;color:var(--tx2);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px;transition:color .15s}
.tab.active{color:var(--tx);border-bottom-color:var(--green)}.tab:hover:not(.active){color:var(--tx)}
.badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;display:inline-block;white-space:nowrap}
.b-danger{background:#FCEBEB;color:#A32D2D}.b-warn{background:#FAEEDA;color:#854F0B}
.b-ok{background:#EAF3DE;color:#3B6D11}.b-blue{background:#E6F1FB;color:#185FA5}.b-gray{background:var(--bg2);color:var(--tx2)}

/* ──────────────────────────────────────────────────────
   NOVOS ESTILOS — TELA TAREFAS OTIMIZADA
   ────────────────────────────────────────────────────── */

/* Cabeçalho da seção de Tarefas */
.tarefas-header-bar {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  padding: 10px 14px; background: var(--bg); border-radius: var(--rl); border: 1px solid var(--bd); margin-bottom: 14px;
}
.tarefas-header-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.tarefas-title { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--tx2); }
.tarefas-sort { display: flex; gap: 4px; }
.tarefas-sort-btn {
  background: var(--bg2); border: none; color: var(--tx2); font-size: 11px; padding: 4px 10px; border-radius: 6px; cursor: pointer; transition: all .15s;
}
.tarefas-sort-btn:hover, .tarefas-sort-btn.active { background: var(--green); color: #fff; }
.tarefas-header-actions { display: flex; gap: 6px; }

/* Filtros */
.filtros-linha { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.filtro-tag { font-size: 11px; padding: 4px 10px; border-radius: 99px; cursor: pointer; border: 1px solid transparent; transition: all .15s; }
.filtro-tag:hover, .filtro-tag.ativo { border-color: var(--bds); }
.filtro-tag.todos { background: var(--bg2); color: var(--tx); }
.filtro-tag.critica { background: rgba(226,75,74,.10); color: #fca5a5; }
.filtro-tag.naovisto { background: rgba(55,138,221,.10); color: #93c5fd; }
.contador-naovistos {
  background: var(--red); color: #fff; font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 99px; margin-left: 6px;
}

/* Card Agrupado por Produto */
.tarefa-produto-card {
  background: var(--bg); border: 1px solid var(--bd); border-radius: var(--rl); overflow: hidden;
  transition: border-color .15s, box-shadow .15s; margin-bottom: 10px;
}
.tarefa-produto-card:hover { border-color: var(--bds); box-shadow: 0 4px 12px rgba(0,0,0,.15); }
.tarefa-produto-card.prioridade-critica { border-left: 3px solid var(--red); }
.tarefa-produto-card.prioridade-urgente { border-left: 3px solid var(--amber); }
.tarefa-produto-card.prioridade-atencao { border-left: 3px solid var(--yellow); }
.tarefa-produto-card.prioridade-ok { border-left: 3px solid var(--green); }

/* Cabeçalho do Card */
.tarefa-produto-hd {
  display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; padding: 12px 14px; align-items: center;
  cursor: pointer;
}
.tarefa-produto-hd:hover { background: var(--bg2); }

.tarefa-produto-img {
  width: 56px; height: 56px; border-radius: 8px; background: #fff; overflow: hidden;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.tarefa-produto-img img { width: 100%; height: 100%; object-fit: contain; }

.tarefa-produto-info { min-width: 0; }
.tarefa-produto-nome { font-size: 13px; font-weight: 700; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tarefa-produto-meta { display: flex; gap: 10px; margin-top: 4px; flex-wrap: wrap; font-size: 11px; color: var(--tx2); }
.tarefa-produto-cod { font-family: monospace; background: var(--bg2); padding: 1px 6px; border-radius: 4px; font-size: 10px; }
.tarefa-produto-venc { display: flex; align-items: center; gap: 4px; }
.tarefa-produto-venc.danger { color: var(--red); font-weight: 600; }
.tarefa-produto-venc.warn { color: var(--amber); font-weight: 600; }
.tarefa-produto-qtd { font-weight: 600; color: var(--tx); }

.tarefa-produto-badges { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.badge-prioridade {
  font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 99px; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap;
}
.badge-prioridade.critica { background: rgba(226,75,74,.15); color: #fca5a5; }
.badge-prioridade.urgente { background: rgba(186,117,23,.15); color: #fcd34d; }
.badge-prioridade.atencao { background: rgba(234,179,8,.15); color: #fde68a; }
.badge-prioridade.ok { background: rgba(29,158,117,.15); color: #6ee7b7; }
.tarefa-produto-preco { font-size: 11px; color: var(--tx2); }
.tarefa-produto-preco b { color: var(--green); font-weight: 700; }

/* Corpo Expandido */
.tarefa-produto-body {
  border-top: 1px solid var(--bd); padding: 12px 14px; display: none; animation: fadeIn .2s ease;
}
.tarefa-produto-body.expandido { display: block; }
@keyframes fadeIn { from { opacity:0; transform: translateY(-4px); } to { opacity:1; transform:none; } }

/* Lotes */
.tarefa-lotes-box { margin-bottom: 12px; }
.tarefa-lotes-title {
  display: flex; align-items: center; justify-content: space-between; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--tx2); margin-bottom: 6px;
}
.tarefa-lotes-list { display: flex; flex-direction: column; gap: 4px; }
.tarefa-lote-item {
  display: grid; grid-template-columns: 120px 80px 1fr; gap: 8px; align-items: center; padding: 6px 10px; background: var(--bg2); border-radius: 6px; font-size: 11px;
}
.tarefa-lote-data { font-weight: 700; }
.tarefa-lote-qtd { text-align: right; font-weight: 700; }
.tarefa-lote-obs { color: var(--tx2); font-size: 10px; }

/* Painel de Avatares dos Colaboradores */
.tarefa-colab-section { }
.tarefa-colab-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.tarefa-colab-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--tx2); }
.btn-notificar-todos {
  background: rgba(55,138,221,.15); border: none; color: #93c5fd; font-size: 10px; padding: 3px 8px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; transition: all .15s;
}
.btn-notificar-todos:hover { background: rgba(55,138,221,.3); }

/* Grade de Avatares */
.avatares-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.avatar-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: transform .15s; position: relative;
}
.avatar-item:hover { transform: translateY(-2px); }
.avatar-circle {
  width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; position: relative; border: 2px solid transparent; transition: all .15s;
}
/* Status do Avatar */
.avatar-status-naovisto { background: var(--bg2); color: var(--tx2); border-color: var(--bd); }
.avatar-status-visto { background: rgba(55,138,221,.2); color: #93c5fd; border-color: rgba(55,138,221,.4); }
.avatar-status-andamento { background: rgba(186,117,23,.2); color: #fcd34d; border-color: rgba(186,117,23,.4); }
.avatar-status-concluido { background: rgba(29,158,117,.2); color: #6ee7b7; border-color: rgba(29,158,117,.4); }
/* Ponto de pendência */
.avatar-notif-dot {
  position: absolute; top: -2px; right: -2px; width: 10px; height: 10px; border-radius: 50%; background: var(--red); border: 2px solid var(--bg);
}
.avatar-name { font-size: 9px; color: var(--tx2); max-width: 52px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
/* Menu de ações no hover */
.avatar-actions {
  display: none; position: absolute; top: 42px; left: 50%; transform: translateX(-50%);
  background: var(--bg); border: 1px solid var(--bds); border-radius: 6px; padding: 6px; z-index: 50;
  box-shadow: 0 4px 12px rgba(0,0,0,.25); min-width: 140px;
}
.avatar-item:hover .avatar-actions { display: flex; flex-direction: column; gap: 3px; }
.avatar-action-btn {
  background: transparent; border: none; color: var(--tx); font-size: 10px; padding: 5px 8px; border-radius: 4px; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 5px; width: 100%;
}
.avatar-action-btn:hover { background: var(--bg2); }
.avatar-action-btn.notificar { color: var(--blue); }
.avatar-action-btn.concluir { color: var(--green); }
.avatar-action-btn.adiar { color: var(--amber); }

/* Botões de ação */
.btn-notificar { background: rgba(55,138,221,.15); color: #93c5fd; border: none; }
.btn-notificar:hover { background: rgba(55,138,221,.3); }
.btn-expandir { background: var(--bg2); color: var(--tx); border: none; }

/* Responsividade */
@media(max-width:768px) {
  .tarefa-produto-hd { grid-template-columns: 48px 1fr; gap: 10px; padding: 10px; }
  .tarefa-produto-img { width: 44px; height: 44px; }
  .tarefa-produto-badges { grid-column: 1/-1; flex-direction: row; justify-content: flex-start; margin-top: 4px; }
  .tarefa-lote-item { grid-template-columns: 1fr 1fr; }
  .tarefa-lote-item > div:last-child { grid-column: 1/-1; }
  .avatares-grid { gap: 6px; }
  .avatar-circle { width: 32px; height: 32px; font-size: 11px; }
  .tarefas-header-bar { flex-direction: column; align-items: stretch; }
}
</style>
</head>
<body class="app">

<!-- Área Principal — Conteúdo da Tela de Tarefas -->
<main style="padding: 20px 24px;">

  <!-- Contadores Gerais (mantidos como na sua tela) -->
  <div class="metrics" style="margin-bottom:16px;">
    <div class="metric">
      <div class="metric-lbl">Total</div>
      <div class="metric-val">4539</div>
    </div>
    <div class="metric clickable" data-filt
